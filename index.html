<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive 3D explorer for Core 16 sea ice: porosity, density and brine from CT scans, section by section.">
  <title>Core 16 · Sea-Ice Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <section class="viewer" aria-label="3D core viewer">
      <canvas id="scene"></canvas>
      <header class="titlebar">
        <p class="eyebrow">Sea ice · CT tomography</p>
        <h1>Core 16</h1>
      </header>
      <div class="mode" role="group" aria-label="Colour the core by">
        <button data-mode="ct" aria-pressed="true">CT voids</button>
        <button data-mode="porosity" aria-pressed="false">Porosity</button>
        <button data-mode="density" aria-pressed="false">Density</button>
        <button data-mode="brine" aria-pressed="false">Brine</button>
        <button data-mode="gi1" aria-pressed="false">GI-1</button>
        <button data-mode="gi2" aria-pressed="false">GI-2</button>
        <button data-mode="hab" aria-pressed="false">Habitat</button>
      </div>
      <div class="legend" id="legend" aria-hidden="true"></div>
      <p class="hint">Drag to rotate · click a section · ← → to change section</p>
      <div class="hover-tip" id="tip" hidden></div>
    </section>

    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Core sections"></nav>
      <div class="tab-body" id="tabBody" role="tabpanel" tabindex="0"></div>
    </aside>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
